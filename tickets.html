<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your Tickets — TASTE The Show</title>
  <meta name="theme-color" content="#07020d">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,900&family=Space+Grotesk:wght@400;500;700&family=Yellowtail&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=3">
  <style>
    .tix-head { text-align: center; margin-bottom: 28px; }
    .tix-head h1 { font-size: clamp(2.6rem, 7vw, 4rem); margin-bottom: .2em; }
    .tix-meta { color: var(--white); font-size: 1.05rem; }
    .tix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .tix {
      background: #fff; color: #111; border-radius: 18px; overflow: hidden;
      display: grid; text-align: center; break-inside: avoid;
    }
    .tix__top { background: radial-gradient(ellipse at 50% 0%, #3a0f55, var(--black) 70%); color: var(--white); padding: 14px 16px; border-bottom: 3px dashed var(--magenta); }
    .tix__brand { height: 60px; width: auto; margin: 0 auto; }
    .tix__label { font-size: .85rem; color: var(--silver); margin-top: 2px; }
    .tix__qr { padding: 18px 18px 6px; }
    .tix__qr img, .tix__qr svg { width: 100%; max-width: 220px; height: auto; margin: 0 auto; display: block; image-rendering: pixelated; }
    .tix__code { font: 700 1.25rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; padding: 6px 0 4px; }
    .tix__name { padding: 0 16px 16px; color: #444; font-size: .92rem; }
    .tix-grid--one { grid-template-columns: minmax(260px, 340px); justify-content: center; }
    .tix__share {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin: 0 16px 16px;
      padding: 11px 14px; border-radius: 999px; border: 2px solid #ff2ed1; background: #fff; color: #c40f9a;
      font: 700 .72rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
    }
    .tix__share:hover { background: #ff2ed1; color: #fff; }
    .tix__used { background: #111; color: #fff; font-size: .75rem; letter-spacing: .15em; text-transform: uppercase; padding: 6px; }
    .tix-actions { justify-content: center; margin: 28px 0 8px; }
    .status-box { max-width: 560px; margin: 0 auto; text-align: center; }
    .spinner { width: 42px; height: 42px; margin: 0 auto 18px; border: 4px solid var(--line); border-top-color: var(--red); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media print {
      body { background: #fff; color: #111; }
      .nav, .tix-actions, .no-print { display: none !important; }
      .page { padding: 0; }
      .tix-head h1, .tix-meta { color: #111; }
      .tix { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a href="./" class="nav__logo" aria-label="TASTE The Show — home"><img src="assets/img/logo-glow-sm.png?v=3" alt="TASTE The Show" width="689" height="389"></a>
    <a href="./#dates" class="btn btn--small">Shows</a>
  </header>

  <main class="page">
    <div class="wrap" id="app">
      <div class="status-box card"><div class="spinner"></div><p>Loading your tickets…</p></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/api.js?v=3"></script>
  <script>
  (function () {
    var F = TasteFmt, esc = TasteEsc, app = document.getElementById("app");
    var params = new URLSearchParams(location.search);
    var id = params.get("order") || "";
    var ticketId = params.get("t") || "";
    var tries = 0;
    var BASE = location.origin + location.pathname;

    function message(title, body, spinner) {
      app.innerHTML = '<div class="status-box card">' + (spinner ? '<div class="spinner"></div>' : "") +
        "<h2>" + title + "</h2><p>" + body + "</p></div>";
    }

    function load() {
      if (/^[0-9a-f-]{36}$/i.test(ticketId)) {
        return TasteAPI.get("/ticket?id=" + encodeURIComponent(ticketId)).then(renderOne).catch(function (e) {
          message("We couldn't find that ticket", esc(e.message) + " Ask the person who sent it to share it again.");
        });
      }
      if (!/^[0-9a-f-]{36}$/i.test(id)) {
        return message("Ticket link not recognised", 'Please use the link from your confirmation email, or <a href="./#dates">get tickets here</a>.');
      }
      TasteAPI.get("/order?id=" + encodeURIComponent(id)).then(render).catch(function (e) {
        message("We couldn't find that order", esc(e.message) + ' If you were charged, please contact us with the email you used.');
      });
    }

    function render(o) {
      if (o.status === "pending") {
        if (tries++ < 30) {
          message("Confirming your payment…", "This usually takes a few seconds. Please don't close this page.", true);
          return setTimeout(load, 2000);
        }
        return message("Still waiting on your payment", "If you completed payment, refresh this page in a minute — your tickets will appear here. If you didn't finish checking out, no charge was made.");
      }
      if (o.status === "expired") {
        return message("This checkout expired", 'No charge was made and the seats were released. <a href="./#dates">Start a new order</a>.');
      }
      if (o.status === "refunded") {
        return message("This order was refunded", "These tickets are no longer valid.");
      }

      var s = o.show;
      var html =
        '<div class="tix-head"><p class="eyebrow">You\'re in, ' + esc(o.buyer_name.split(" ")[0]) + "!</p>" +
        "<h1>" + esc(s.title) + "</h1>" +
        '<p class="tix-meta"><strong>' + F.date(s.starts_at) + "</strong><br>" +
        (s.doors_at ? "Doors " + F.time(s.doors_at) + " · " : "") + "Show " + F.time(s.starts_at) + "<br>" +
        esc(s.venue) + " · " + esc(s.address) + "</p>" +
        '<p class="muted no-print">Show each QR code at the door — one code per guest. Screenshot this page or bookmark it.' +
        (o.tickets.length > 1 ? " Friends arriving separately? Tap <strong>Send to a friend</strong> on a ticket to text them their own." : "") + "</p></div>" +
        '<div class="tix-grid">';
      o.tickets.forEach(function (t) {
        html += '<article class="tix">' +
          '<div class="tix__top"><img class="tix__brand" src="assets/img/logo-glow-sm.png?v=3" alt="TASTE The Show"><div class="tix__label">' + esc(t.label) + "</div></div>" +
          '<div class="tix__qr">' + qrSvg(t.code) + "</div>" +
          '<div class="tix__code">' + esc(t.code) + "</div>" +
          '<div class="tix__name">' + esc(o.buyer_name) + "</div>" +
          (t.checked_in ? '<div class="tix__used">Checked in</div>' : "") +
          (o.tickets.length > 1 && !t.checked_in ? '<button class="tix__share no-print" type="button" data-share="' + esc(t.id) + '" data-label="' + esc(t.label) + '">' + shareIcon + " Send to a friend</button>" : "") +
          "</article>";
      });
      html += "</div>" +
        '<div class="row tix-actions"><button class="btn" onclick="window.print()">Print / Save PDF</button>' +
        '<a class="btn btn--ghost" href="' + mapsLink(s) + '" target="_blank" rel="noopener">Directions</a></div>' +
        '<p class="fine center no-print">Bring your tipping money — we\'ll make change for you!</p>';
      app.innerHTML = html;
      wireShare(s);
    }

    // A single shared ticket (opened from a friend's link).
    function renderOne(t) {
      var s = t.show;
      app.innerHTML =
        '<div class="tix-head"><p class="eyebrow">' + esc(t.from_name.split(" ")[0]) + " sent you a ticket!</p>" +
        "<h1>" + esc(s.title) + "</h1>" +
        '<p class="tix-meta"><strong>' + F.date(s.starts_at) + "</strong><br>" +
        (s.doors_at ? "Doors " + F.time(s.doors_at) + " · " : "") + "Show " + F.time(s.starts_at) + "<br>" +
        esc(s.venue) + " · " + esc(s.address) + "</p>" +
        '<p class="muted no-print">This is your ticket. Show the QR code at the door — screenshot it or keep this page handy.</p></div>' +
        '<div class="tix-grid tix-grid--one"><article class="tix">' +
        '<div class="tix__top"><img class="tix__brand" src="assets/img/logo-glow-sm.png?v=3" alt="TASTE The Show"><div class="tix__label">' + esc(t.label) + "</div></div>" +
        '<div class="tix__qr">' + qrSvg(t.code) + "</div>" +
        '<div class="tix__code">' + esc(t.code) + "</div>" +
        '<div class="tix__name">Guest of ' + esc(t.from_name) + "</div>" +
        (t.checked_in ? '<div class="tix__used">Checked in</div>' : "") +
        "</article></div>" +
        '<div class="row tix-actions"><button class="btn" onclick="window.print()">Print / Save PDF</button>' +
        '<a class="btn btn--ghost" href="' + mapsLink(s) + '" target="_blank" rel="noopener">Directions</a></div>' +
        '<p class="fine center no-print">Bring your tipping money — we\'ll make change for you! · <a href="./">About TASTE</a></p>';
    }

    var shareIcon = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>';

    function wireShare(s) {
      app.querySelectorAll("[data-share]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var url = BASE + "?t=" + btn.dataset.share;
          var text = "Here's your ticket for TASTE The Show — " + F.date(s.starts_at) + ", " + s.venue + ". Show the QR code at the door!";
          if (navigator.share) {
            navigator.share({ title: "Your TASTE ticket", text: text, url: url }).catch(function () {});
          } else {
            copy(text + " " + url, btn);
          }
        });
      });
    }

    function copy(value, btn) {
      var done = function () { var old = btn.innerHTML; btn.textContent = "Link copied — paste it in a text!"; setTimeout(function () { btn.innerHTML = old; }, 2600); };
      if (navigator.clipboard) navigator.clipboard.writeText(value).then(done, function () { prompt("Copy this link:", value); });
      else prompt("Copy this link:", value);
    }

    function qrSvg(text) {
      var qr = qrcode(0, "M");
      qr.addData(text);
      qr.make();
      return qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true, alt: "QR code for ticket " + text });
    }

    function mapsLink(s) {
      return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.venue + " " + s.address);
    }

    load();
  })();
  </script>
</body>
</html>
