<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex">
  <title>Door Check-In — TASTE</title>
  <meta name="theme-color" content="#07020d">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,700;1,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .page { padding-top: 84px; }
    .door { max-width: 520px; margin: 0 auto; }
    #reader { border-radius: 18px; overflow: hidden; background: #000; min-height: 260px; }
    #reader video { object-fit: cover; }
    .manual { display: flex; gap: 10px; margin-top: 14px; }
    .manual input { text-transform: uppercase; font-family: ui-monospace, Menlo, monospace; letter-spacing: .08em; }
    .result {
      margin-top: 16px; padding: 22px; border-radius: 18px; text-align: center;
      background: var(--panel); border: 2px solid var(--line);
    }
    .result h2 { font-size: 2.2rem; margin: 0 0 .15em; }
    .result p { margin: 0; color: var(--white); }
    .result .who { font-size: 1.3rem; font-weight: 700; margin-top: 6px; }
    .result--ok { background: #0f3d24; border-color: #2ecc71; }
    .result--used { background: #4a3a05; border-color: #f1c40f; }
    .result--bad { background: #4a0b13; border-color: var(--red); }
    .result .btn { margin-top: 14px; }
    .log { list-style: none; padding: 0; margin: 20px 0 0; font-size: .9rem; }
    .log li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .log code { color: var(--white); }
  </style>
</head>
<body>
  <header class="nav">
    <a href="./" class="nav__logo" aria-label="TASTE The Show — home"><img src="assets/img/logo.png" alt="TASTE The Show" width="1298" height="698"></a>
    <span class="pill">Door</span>
    <a href="admin.html" class="btn btn--small btn--ghost">Admin</a>
  </header>

  <main class="page">
    <div class="wrap door">
      <form class="card" id="login">
        <h2>Door check-in</h2>
        <p class="muted">Enter the staff password to start scanning.</p>
        <label>Staff password<input type="password" name="password" autocomplete="current-password" required></label>
        <p class="form-error" id="login-error" hidden></p>
        <button class="btn" type="submit" style="margin-top:14px">Start</button>
      </form>

      <div id="scanner" hidden>
        <div id="reader"></div>
        <p class="fine center" id="cam-msg">Point the camera at a ticket QR code.</p>
        <form class="manual" id="manual">
          <input name="code" placeholder="Or type code: TST-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="btn" type="submit">Check</button>
        </form>
        <div id="result" class="result" hidden></div>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
  (function () {
    var esc = TasteEsc, F = TasteFmt;
    var pw = "";
    try { pw = sessionStorage.getItem("taste_staff") || ""; } catch (e) {}
    var loginForm = document.getElementById("login");
    var resultEl = document.getElementById("result");
    var logEl = document.getElementById("log");
    var scanner = null, busy = false, lastCode = "", lastAt = 0;

    function staff(body) {
      return TasteAPI.post("/staff", Object.assign({ password: pw }, body));
    }

    if (pw) staff({ action: "login" }).then(start).catch(function () { pw = ""; });

    loginForm.addEventListener("submit", function (e) {
      e.preventDefault();
      pw = new FormData(loginForm).get("password");
      var err = document.getElementById("login-error");
      err.hidden = true;
      staff({ action: "login" }).then(function () {
        try { sessionStorage.setItem("taste_staff", pw); } catch (e) {}
        start();
      }).catch(function (e) { err.textContent = e.message; err.hidden = false; });
    });

    function start() {
      loginForm.hidden = true;
      document.getElementById("scanner").hidden = false;
      if (!window.Html5Qrcode) {
        document.getElementById("cam-msg").textContent = "Camera scanner unavailable — type codes below.";
        return;
      }
      scanner = new Html5Qrcode("reader", { verbose: false });
      scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 240, height: 240 } }, onScan)
        .catch(function () {
          document.getElementById("cam-msg").textContent = "Couldn't open the camera. Allow camera access, or type codes below.";
        });
    }

    function onScan(text) {
      var now = Date.now();
      if (busy || (text === lastCode && now - lastAt < 4000)) return;
      lastCode = text; lastAt = now;
      check(text);
    }

    document.getElementById("manual").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = this.elements.code;
      if (input.value.trim()) check(input.value.trim());
      input.value = "";
    });

    function check(code, undo) {
      busy = true;
      staff({ action: "checkin", code: code, undo: !!undo }).then(function (r) {
        show(r);
        if (navigator.vibrate) navigator.vibrate(r.result === "ok" ? 80 : [200, 80, 200]);
      }).catch(function (e) {
        show({ result: "error", message: e.message });
      }).then(function () {
        setTimeout(function () { busy = false; }, 1200);
      });
    }

    function show(r) {
      var cls = "result ", title, body = "";
      var who = r.holder_name ? '<p class="who">' + esc(r.holder_name) + "</p><p>" + esc(r.label || r.ticket_type || "") + "</p>" : "";
      if (r.result === "ok") { cls += "result--ok"; title = "✅ Valid — Welcome!"; body = who; }
      else if (r.result === "already_used") { cls += "result--used"; title = "⚠️ Already used"; body = who + "<p>Checked in at " + F.time(r.checked_in_at) + "</p>"; }
      else if (r.result === "undone") { cls += "result--used"; title = "↩︎ Check-in undone"; body = who; }
      else if (r.result === "invalid") { cls += "result--bad"; title = "❌ Not valid"; body = who + "<p>This ticket was " + esc(r.reason) + ".</p>"; }
      else if (r.result === "not_found") { cls += "result--bad"; title = "❌ Unknown code"; body = "<p><code>" + esc(r.code) + "</code> is not a TASTE ticket.</p>"; }
      else { cls += "result--bad"; title = "Error"; body = "<p>" + esc(r.message || "Try again.") + "</p>"; }
      if (r.result === "ok" || r.result === "already_used") {
        body += '<button class="btn btn--small btn--ghost" data-undo="' + esc(r.code) + '">Undo check-in</button>';
      }
      resultEl.className = cls;
      resultEl.innerHTML = "<h2>" + title + "</h2>" + body;
      resultEl.hidden = false;
      var undoBtn = resultEl.querySelector("[data-undo]");
      if (undoBtn) undoBtn.addEventListener("click", function () { check(undoBtn.dataset.undo, true); });

      if (r.code) {
        var li = document.createElement("li");
        li.innerHTML = "<span><code>" + esc(r.code) + "</code> " + esc(r.holder_name || "") + "</span><span>" + title.split(" ")[0] + " " +
          F.time(new Date().toISOString()) + "</span>";
        logEl.insertBefore(li, logEl.firstChild);
        while (logEl.children.length > 15) logEl.removeChild(logEl.lastChild);
      }
    }
  })();
  </script>
</body>
</html>
